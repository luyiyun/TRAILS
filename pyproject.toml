[project]
name = "trails"
version = "0.1.0"
description = "Deep survival trajectory clustering for irregular multivariate clinical longitudinal data"
readme = "README.md"
authors = [
    { name = "rong", email = "rongzhiwei@tmu.edu.cn" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.4,<1.5",
    "hydra-core>=1.3.2",
    "matplotlib>=3.8.0",
    "numpy>=2.4.4",
    "pandas>=3.0.3",
    "pydantic>=2.13.4",
    "scipy>=1.17.1",
    "scikit-fda>=0.10.1",
    "scikit-learn>=1.8.0",
    "scikit-survival>=0.28.0,<0.29",
    "swanlab>=0.7.18",
    "torch>=2.12.0",
    "torchmetrics>=1.9.0",
    "tqdm>=4.67.3",
    "umap-learn>=0.5.12",
    "lifelines>=0.30,<0.31",
]

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "captum>=0.9.0",
    "ipdb>=0.13.13",
    "optuna>=4.8.0",
    "pyright>=1.1.409",
    "pytest>=9.0.3",
    "ruff>=0.15.13",
    "seaborn>=0.13.2",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests", "scripts"]
typeCheckingMode = "standard"
reportPrivateImportUsage = false
