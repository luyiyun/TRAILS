# @package _global_

experiment:
  name: formal-5x
  repeats: 5
  seed: 20260517
  seed_stride: 100

simulator:
  patients: 3000
  split_patients: [3000, 1000, 1000]
  n_clusters: 4
  min_visits: 3
  max_visits: 16
  hidden_size: 128
  latent_dim: 8
  attention_layers: 4
  attention_heads: 4
  censoring_rate: 0.45
  weibull_shape: 1.3
  x_low: -8.0
  x_high: 8.0
  beta_low: -1.8
  beta_high: 1.8

model:
  latent_dim: 16
  n_clusters: 4
  dropout: 0.0
  encoder:
    input:
      kind: grud
      hidden_dim: 64
      n_heads: 2
    mapping:
      kind: gru
      hidden_dim: 64
      n_layers: 1
      n_heads: 2
  decoder:
    kind: gru
    conditioning: initial_state
    hidden_dim: 64
    n_layers: 1
    n_heads: 2

trainer:
  max_epochs: 80
  batch_size: 64
  learning_rate: 3.0e-4
  reconstruction_weight: 1.0
  survival_weight: 0.2
  cluster_weight: 0.05
  warmup_epochs: 20
  gmm_init_iters: 20
  gradient_clip_norm: 5.0
  device: cpu
  seed: 20260517

artifacts:
  names: [all]
  save: null

swanlab:
  enabled: false
  project: TRAILS
  experiment: formal-5x
  mode: null
