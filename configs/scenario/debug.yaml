# @package _global_

experiment:
  name: debug
  repeats: 1
  seed: 20260517
  seed_stride: 100

simulator:
  patients: 3000
  split_patients: [3000, 1000, 1000]
  n_clusters: 4
  min_visits: 3
  max_visits: 16
  hidden_size: 128
  latent_dim: 8
  attention_layers: 4
  attention_heads: 4
  censoring_rate: 0.45
  weibull_shape: 1.3
  x_low: -8.0
  x_high: 8.0
  beta_low: -1.8
  beta_high: 1.8

model:
  encoder_hidden_dim: 64
  decoder_hidden_dim: 64
  latent_dim: 16
  n_clusters: 4
  n_layers: 2
  dropout: 0.0

trainer:
  max_epochs: 80
  batch_size: 256
  learning_rate: 1e-2
  reconstruction_weight: 1.0
  survival_weight: 0.2
  cluster_weight: 0.05
  warmup_epochs: 0
  gmm_init_iters: 20
  gradient_clip_norm: 5.0
  device: "cuda:0"
  seed: 20260517

artifacts:
  names: [all]
  save: null

diagnostics:
  latent_embeddings:
    enabled: true

swanlab:
  enabled: true
  project: TRAILS
  experiment: normal-swanlab
  mode: null
