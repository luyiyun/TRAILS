defaults:
  - _self_
  - simulation: quick
  - training: small
  - baseline: default
  - optim: default
  - summary: default
  - optional case: null

command: simulate

run:
  output_root: outputs
  prefix: ${trails_run_prefix:${command},${simulation.name},${paths.data_root}}
  name: ${run.prefix}-${now:%Y%m%d-%H%M%S-%f}

paths:
  data_root: data/simulated
  explicit_split:
    enabled: false
    train_data: data/simulated/train.pt
    test_data: data/simulated/test.pt

hydra:
  job:
    chdir: false
  run:
    dir: ${run.output_root}/${command}/${run.name}
  sweep:
    dir: ${run.output_root}/multirun/${command}/${run.name}
    subdir: ${hydra.job.num}
