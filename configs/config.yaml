defaults:
  - _self_
  - simulation: base
  - training: base
  - baseline: default
  - optim: default
  - scenario: quick

command: simulate

paths:
  data_root: null
  data: null
  test_data: null
  train_root: null

hydra:
  job:
    chdir: false
  run:
    dir: outputs/${simulation.name}/${command}-${now:%Y%m%d-%H%M%S-%f}
  sweep:
    dir: multirun/${simulation.name}/${command}-${now:%Y%m%d-%H%M%S-%f}
    subdir: ${hydra.job.num}
