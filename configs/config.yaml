defaults:
  - _self_
  - experiment: base
  - simulator: base
  - model: base
  - trainer: base
  - artifacts: all
  - diagnostics: disabled
  - swanlab: disabled
  - optim: default
  - scenario: quick

command: experiment

paths:
  data_root: null
  data: null
  test_data: null
  train_root: null

hydra:
  job:
    chdir: false
  run:
    dir: outputs/${experiment.name}/${now:%Y%m%d-%H%M%S-%f}
  sweep:
    dir: multirun/${experiment.name}/${now:%Y%m%d-%H%M%S-%f}
    subdir: ${hydra.job.num}
