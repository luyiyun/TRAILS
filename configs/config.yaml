defaults:
  - _self_
  - scenario: quick

command: experiment

experiment:
  name: base
  repeats: 1
  seed: 20260517
  seed_stride: 100

paths:
  data_root: null
  data: null
  val_data: null
  test_data: null
  train_root: null

simulator:
  patients: 128
  split_patients: [128, 32, 32]
  n_clusters: 3
  min_visits: 4
  max_visits: 8
  hidden_size: 100
  latent_dim: 5
  attention_layers: 3
  attention_heads: null
  censoring_rate: 0.3
  weibull_shape: 1.0
  x_low: -10.0
  x_high: 10.0
  beta_low: -2.5
  beta_high: 2.5

model:
  encoder_hidden_dim: 32
  decoder_hidden_dim: 32
  latent_dim: 8
  n_clusters: 3
  n_layers: 1
  dropout: 0.0
  survival_head_hidden_layers: 0

trainer:
  max_epochs: 5
  batch_size: 16
  learning_rate: 1.0e-3
  reconstruction_weight: 1.0
  survival_weight: 0.2
  cluster_weight: 0.05
  warmup_epochs: 1
  gmm_init_iters: 20
  gradient_clip_norm: 5.0
  device: cpu
  seed: 2026

artifacts:
  names: [all]
  save: null

diagnostics:
  latent_embeddings:
    enabled: false

swanlab:
  enabled: false
  project: TRAILS
  experiment: null
  mode: null

optim:
  n_trials: 30
  study_name: ${experiment.name}
  root: outputs/optim/${experiment.name}
  storage: null

hydra:
  job:
    chdir: false
  run:
    dir: outputs/${experiment.name}/${now:%Y%m%d-%H%M%S-%f}
  sweep:
    dir: multirun/${experiment.name}/${now:%Y%m%d-%H%M%S-%f}
    subdir: ${hydra.job.num}
