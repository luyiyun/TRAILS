defaults:
  - _self_
  - simulation: quick
  - training: small
  - baseline: default
  - optim: default

command: simulate

paths:
  data_root: null
  data: null
  test_data: null
  train_root: null

hydra:
  job:
    chdir: false
  run:
    dir: outputs/${command}-${now:%Y%m%d-%H%M%S-%f}
  sweep:
    dir: multirun/${command}-${now:%Y%m%d-%H%M%S-%f}
    subdir: ${hydra.job.num}
