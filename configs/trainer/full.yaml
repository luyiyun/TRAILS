# 正式训练协议；由验证指标早停并保留较充分的优化预算。
min_epochs: 100
max_epochs: 300
batch_size: 1024
learning_rate: 1e-3
warmup_epochs: 10
gmm_init_iters: 5
gradient_clip_norm: 1.0
device: cuda:0
seed: 20260517
valid_size: 0.2
early_stop: true
early_stopping_patience: 30
early_stopping_min_delta: 0.0
early_stopping_monitor: loss
