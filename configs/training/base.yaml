model:
  latent_dim: 8
  n_clusters: 3
  dropout: 0.0
  survival_head_hidden_layers: 0
  loss:
    weighting: uncertainty
    reconstruction_weight: 1.0
    survival_weight: 0.2
    cluster_weight: 0.05
  encoder:
    input:
      kind: grud
      hidden_dim: 32
      n_heads: 2
    mapping:
      kind: gru
      hidden_dim: 32
      n_layers: 1
      n_heads: 2
  decoder:
    kind: gru
    conditioning: initial_state
    hidden_dim: 32
    n_layers: 1
    n_heads: 2
trainer:
  max_epochs: 5
  batch_size: 16
  learning_rate: 1.0e-3
  warmup_epochs: 1
  gmm_init_iters: 20
  gradient_clip_norm: 5.0
  device: cpu
  seed: 2026
  valid_size: 0.2
artifacts:
  names: [all]
  save: null
diagnostics:
  latent_embeddings:
    enabled: false
swanlab:
  enabled: false
  project: TRAILS
  experiment: null
  mode: null
