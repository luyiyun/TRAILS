model:
  latent_dim: 32
  n_clusters: 4
  dropout: 0.0
  survival_head_hidden_layers: 2
  loss:
    weighting: uncertainty
    reconstruction_weight: 1.0
    survival_weight: 0.2
    cluster_weight: 0.1
  encoder:
    input:
      kind: grud
      hidden_dim: 64
      n_heads: 2
    mapping:
      kind: transformer
      hidden_dim: 64
      n_layers: 2
      n_heads: 2
  decoder:
    kind: transformer
    conditioning: concat_time
    hidden_dim: 64
    n_layers: 2
    n_heads: 2
trainer:
  max_epochs: 300
  batch_size: 256
  learning_rate: 3.0e-4
  warmup_epochs: 20
  gmm_init_iters: 20
  gradient_clip_norm: null
  device: cuda:0
  seed: 20260517
  valid_size: 0.0
artifacts:
  names: [all]
  save: null
diagnostics:
  latent_embeddings:
    enabled: true
swanlab:
  enabled: true
  project: TRAILS
  experiment: normal-swanlab
  mode: null
