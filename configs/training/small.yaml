# @package _global_
name: small
model:
  latent_dim: 4
  n_clusters: 3
  dropout: 0.0
  survival_head_hidden_layers: 0
  loss:
    weighting: uncertainty
    reconstruction_weight: 1.0
    survival_weight: 0.2
    cluster_weight: 0.05
  encoder:
    input:
      kind: grud
      hidden_dim: 16
      n_heads: 2
    mapping:
      kind: gru
      hidden_dim: 16
      n_layers: 1
      n_heads: 2
  decoder:
    kind: gru
    conditioning: initial_state
    hidden_dim: 16
    n_layers: 1
    n_heads: 2
trainer:
  max_epochs: 2
  batch_size: null
  learning_rate: 1.0e-3
  warmup_epochs: 1
  gmm_init_iters: 5
  gradient_clip_norm: 5.0
  device: cpu
  seed: 20260517
  valid_size: 0.2
  early_stop: true
  early_stopping_patience: 30
  early_stopping_min_delta: 0.0
  early_stopping_monitor: "cindex"
artifacts:
  names: [config, history, test, plot]
  save: null
diagnostics:
  latent_embeddings:
    enabled: false
parallel:
  workers: 1
  devices: []
  torch_threads: null
swanlab:
  enabled: false
  project: TRAILS
  experiment: small
  mode: null
