# @package _global_
defaults:
  - /model: base
  - /trainer: full
  - _self_

description: "MIMIC-IV v3.1 early Sepsis-3 TRAILS analysis"
split:
  seed: 20260517
  dir: data/real/mimic-iv-3.1/derived/trails_splits/seed-${split.seed}
# 逐个训练全部seed/K；全部训练完成后报告train/validation/test，不自动选择。
n_clusters: [2, 3, 4, 5]
seeds: [20260517]
min_cluster_fraction: 0.05
trainer:
  risk_horizon: 28.0
artifacts:
  names: [history, plot]
diagnostics:
  latent_embeddings:
    enabled: false
swanlab:
  enabled: false
  experiment: mimic
  mode: cloud

paths:
  dir: outputs/mimic_case/mimic_case-${now:%Y%m%d-%H%M%S-%f}

hydra:
  job:
    chdir: false
  run:
    dir: ${paths.dir}
