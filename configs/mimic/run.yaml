# @package _global_
defaults:
  - /training: case
  - _self_

observations_csv: data/real/mimic-iv-3.1/derived/trails_case/observations.csv
patients_csv: data/real/mimic-iv-3.1/derived/trails_case/patients.csv
description: "MIMIC-IV v3.1 early Sepsis-3 TRAILS analysis"
split:
  seed: 20260517
  dir: data/real/mimic-iv-3.1/derived/trails_splits/seed-${split.seed}
outputs:
  summary: run_manifest.json
# 默认只做资源与流程检查；正式分析仍从本入口通过 Hydra overrides 调整。
model:
  n_clusters: 3
trainer:
  risk_horizon: 28.0
  min_epochs: 1
  max_epochs: 1
  batch_size: 256
  warmup_epochs: 1
  gmm_init_iters: 5
  early_stop: true
  early_stopping_monitor: loss
artifacts:
  names: [history, plot]
diagnostics:
  latent_embeddings:
    enabled: false
swanlab:
  enabled: false
  experiment: mimic
  mode: cloud

paths:
  dir: outputs/mimic_case/mimic_case-${now:%Y%m%d-%H%M%S-%f}

hydra:
  job:
    chdir: false
  run:
    dir: ${paths.dir}
