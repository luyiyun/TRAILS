# @package _global_
paths:
  patients_csv: data/real/mimic-iv-3.1/derived/trails_case/patients.csv
  observations_csv: data/real/mimic-iv-3.1/derived/trails_case/observations.csv
  dir: data/real/mimic-iv-3.1/derived/trails_splits

description: "MIMIC-IV v3.1 early Sepsis-3 TRAILS analysis"
feature_order: []
split:
  strategy: random
  seeds: [20260517]
  random:
    train_fraction: 0.64
    validation_fraction: 0.16
    test_fraction: 0.20
  temporal:
    test_start_year: 2017
    # 从测试年代之前的开发队列中，随机抽取该比例作为验证集。
    validation_fraction: 0.20

hydra:
  job:
    chdir: false
  run:
    dir: ${paths.dir}
