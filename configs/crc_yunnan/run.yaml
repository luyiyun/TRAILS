# @package _global_
defaults:
  - /model: base
  - /trainer: full
  - _self_

description: "CRC Yunnan baseline: r089, K=2-10, seed=20260908"
split:
  seed: 20260908
  strategy: random
  dir: data/derived/crc_yunnan/preproc/v2/os/landmark-24m/E60/auto-log1p-robust/${split.strategy}/seed-${split.seed}

# 使用OS、24个月landmark、E60、auto-log1p、robust预处理方案。
# 每个seed/K独立训练并报告三集指标，由06/07显式指定要展示的K。
n_clusters: [2, 3, 4, 5, 6, 7, 8, 9, 10]
seeds: [20260908]
min_cluster_fraction: 0.05

model:
  survival_loss: weibull
  latent_dim: 32
  dropout: 0.0
  survival_head_hidden_layers: 1
  mixture_logits_trained: true
  loss:
    weighting: fixed
    reconstruction_weight: 1.0
    survival_weight: 0.05
    cluster_weight: 0.1
  encoder:
    input:
      kind: grud
      hidden_dim: 64
      n_heads: 2
      num_ref_points: 16
      learn_time_embedding: true
      time_embedding_dim: null
      time_embedding_frequency: 10.0
      time_embedding_kind: projection
      value_projection_dim: 1
    mapping:
      kind: lstm
      hidden_dim: 64
      n_layers: 1
      n_heads: 2
  decoder:
    kind: lstm
    conditioning: initial_state
    hidden_dim: 64
    n_layers: 1
    n_heads: 2
trainer:
  seed: 20260908
  valid_size: 0.0
  min_epochs: 100
  max_epochs: 300
  batch_size: 64
  learning_rate: 1e-3
  warmup_epochs: 30
  warmup_objective: reconstruction
  gmm_init_iters: 5
  mixture_init: kmeans_global
  mixture_init_n_init: 10
  mixture_init_max_iter: 200
  # 仅在混合初始化时对潜变量方差截断，不是训练期间的永久下界。
  mixture_variance_floor: 1e-4
  mixture_prior: empirical
  initialize_without_warmup: true
  reset_survival_after_warmup: true
  reset_optimizer_after_warmup: false
  uncertainty_after_warmup: continue
  lr_scheduler: constant
  scheduler_min_lr_ratio: 0.01
  scheduler_factor: 0.5
  scheduler_patience: 10
  epoch_diagnostics: true
  gradient_clip_norm: 1.0
  device: cuda:0
  early_stop: true
  early_stopping_patience: 30
  early_stopping_min_delta: 0.0
  early_stopping_monitor: loss
  risk_horizon: 1.0
  # 使用负log混合中位生存时间排序。
  cindex_risk_score: median_survival
parallel:
  workers: 1
  devices: []
  torch_threads: 4
# 保持原07实验的GPU计算设置；启用新的确定性算法会改变历史运行条件。
runtime:
  torch_interop_threads: 4
  cudnn_benchmark: false
  cudnn_deterministic: false
  deterministic_algorithms: false
  cuda_matmul_allow_tf32: false
  cudnn_allow_tf32: true
artifacts:
  names: [history]
swanlab:
  enabled: false
paths:
  dir: outputs/crc_yunnan/modeling/run-${now:%Y%m%d-%H%M%S-%f}

hydra:
  job:
    chdir: false
  run:
    dir: ${paths.dir}
