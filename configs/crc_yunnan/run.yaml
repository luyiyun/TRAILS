# @package _global_
defaults:
  - /model: base
  - /trainer: full
  - _self_

description: "CRC Yunnan DFS TRAILS analysis on frozen splits"
split:
  seed: 20260908
  # 改为 temporal-2017 即读取同版本的时间划分；每次只运行一套。
  strategy: random
  dir: data/derived/crc_yunnan/splits/v1/dfs/landmark-12m/E60/auto-log1p-robust/${split.strategy}/seed-${split.seed}

# 使用选定的E60、auto-log1p、robust预处理方案，固定K=3。
# 设为null时才启用下面的K选择；整数使用trainer.seed训练固定K。
n_clusters: 3
k_selection:
  enabled: true
  candidate_clusters: [2, 3, 4, 5, 6, 7, 8, 9, 10]
  seeds: [20260908, 20260909, 20260910]
  selection_rule: one_standard_error
  require_non_empty: true
  min_cluster_fraction: 0.05
  compute_stability: false
  min_mean_pairwise_ari: null
  result_dir: k_selection

model:
  latent_dim: 32
  loss:
    weighting: uncertainty
    reconstruction_weight: 1.0
    survival_weight: 0.2
    cluster_weight: 0.1
trainer:
  seed: 20260909
  valid_size: 0.0
  batch_size: 128
  learning_rate: 1e-3
  warmup_epochs: 10
  gmm_init_iters: 5
  # 使用负对数预测中位DFS时间排序；不使用risk_horizon，也不截断随访。
  cindex_risk_score: median_survival
artifacts:
  names: [history]
swanlab:
  enabled: false
outputs:
  summary: run_manifest.json
paths:
  dir: outputs/crc_yunnan/modeling/dfs12-e60-${split.strategy}-${now:%Y%m%d-%H%M%S-%f}

hydra:
  job:
    chdir: false
  run:
    dir: ${paths.dir}
