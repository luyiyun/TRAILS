# @package _global_
dataset: crc_yunnan
version: v2-g14-clean-20261008

paths:
  raw_root: data/real/crc_yunnan
  patients_csv: ${paths.raw_root}/surv_all_no_name.csv
  observations_csv: ${paths.raw_root}/long_combine_no_name.csv
  derived_dir: data/derived/crc_yunnan/cohort/${version}
  run_dir: outputs/crc_yunnan/cohort_runs/${version}

columns:
  export_index: "Unnamed: 0"
  patient_id: 住院号
  surgery_date: 手术日期
  last_followup_date: 末次随访时间
  survival_time: Survival_Time
  death: Death
  recurrence_free_time: Recurrence_free_Time
  recurrence: Recurrence
  baseline:
    - Preoperative_CEA
    - Preoperative_CA242
    - Age
    - Sex
    - Primary_site
    - Surgical_approach
    - Tumor_differentiation
    - AJCC_8th_ed_Stage
    - Lymph_node_yield
    - Mucinous_colloid_type
    - Lymphovascular_invasion
    - Perineural_invasion
    - Adjuvant_chemotherapy
  feature: var_name
  feature_group: var_type
  measurement_date: 测量日期
  value: value

processing:
  drop_export_index: true
  research_id_seed: 20260908
  apply_date_corrections: true
  same_day_aggregation: median
  exclude_invalid_surgery_date: true
  exclude_negative_outcome_time: true
  exclude_followup_before_surgery: true
  max_outcome_days: 7305
  outcome_time_unit_days: 30
  refuse_overwrite: true
  # 本轮确认的探索性界限，端点保留；不是公认生理极限，不修正单位或小数点。
  observation_value_bounds:
    CEA: {min: 0}
    CA242: {min: 0}
    CA125: {min: 0}
    血清白蛋白: {min: 0, max: 100}
    总蛋白: {min: 0, max: 200}
    白球比: {min: 0, max: 10}
    前白蛋白: {min: 0, max: 1000}
    胆碱酯酶: {min: 0, max: 50000}
    红细胞: {min: 0.1, max: 20}
    红细胞平均体积: {min: 20, max: 300}
    平均血小板体积: {min: 1, max: 50}
    中性粒细胞绝对值: {min: 0, max: 200}
    乳酸脱氢酶: {min: 0, max: 20000}
    尿素: {min: 0, max: 100}

date_corrections:
  patients:
    "0004-07-20": "2004-07-20"
  observations:
    "0005-04-20": "2005-04-20"
    "3019-10-29": "2019-10-29"

hydra:
  job:
    chdir: false
  run:
    dir: ${paths.run_dir}
