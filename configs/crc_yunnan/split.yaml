# @package _global_
dataset: crc_yunnan
version: v1
split_version: v1
outcome: dfs
landmark_months: 12

paths:
  preprocessed_root: data/derived/crc_yunnan/preprocessed/${version}
  patients_csv: ${paths.preprocessed_root}/patients.csv
  observations_csv: ${paths.preprocessed_root}/observations.csv
  assignment_root: data/derived/crc_yunnan/assignments/${split_version}
  dir: data/derived/crc_yunnan/splits/${split_version}/${outcome}/landmark-${landmark_months}m/${features.panel}
  output_dir: outputs/crc_yunnan/splits/${split_version}/${outcome}/landmark-${landmark_months}m/${features.panel}
  run_dir: outputs/crc_yunnan/split_runs/${now:%Y%m%d-%H%M%S}

cohort:
  min_observation_dates: 2
  exclude_followup_before_surgery: true
  max_outcome_days: 7305

split:
  strategies: [random, temporal]
  seeds: [20260908]
  random:
    train_fraction: 0.64
    validation_fraction: 0.16
    test_fraction: 0.20
  temporal:
    test_start_year: 2017
    validation_fraction: 0.20

