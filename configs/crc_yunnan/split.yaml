# @package _global_
dataset: crc_yunnan
version: v2-g14-clean-20261008
# 继续复用原v2主划分；清洗后的输出独立保存。
split_version: v2

paths:
  cohort_root: data/derived/crc_yunnan/cohort/${version}
  patients_csv: ${paths.cohort_root}/patients.csv
  observations_csv: ${paths.cohort_root}/observations.csv
  assignment_root: data/derived/crc_yunnan/assignments/${split_version}
  dir: data/derived/crc_yunnan/splits/${version}
  run_dir: outputs/crc_yunnan/split_runs/${now:%Y%m%d-%H%M%S-%f}

save_full_dataset: false
split:
  strategies: [random]
  seeds: [20260908]
  random:
    train_fraction: 0.64
    validation_fraction: 0.16
    test_fraction: 0.20
  temporal:
    test_start_year: 2017
    validation_fraction: 0.20

hydra:
  job:
    chdir: false
  run:
    dir: ${paths.run_dir}
