# @package _global_
inputs:
  run_dir: ???
# 当前固定N2-K6；输入必须明确指向已经训练好的05目录。
n_clusters: 6
model_seed: 20260908
trajectory_selection:
  minimum_shared_bins: 4
  level_weight: 0.5
datasets: [train, validation, test]
umap:
  n_neighbors: 15
  min_dist: 0.1
  metric: euclidean
  seed: 20260908
survival:
  months: [12, 36, 60]
  curve_step_months: 1
  calibration_bins: 5
trajectory_bin_days: 90
seed: 20260908
device: cpu
plot:
  dpi: 600
  font_families: ["DejaVu Sans", "Arial", "Liberation Sans"]
figure:
  profile_dataset: train
  display_datasets: [train, validation, test]
  cox_dataset: test
  phase_days: [0, 90, 360, 720]
  display_months: 60
  risk_months: [0, 12, 36, 60]
  min_observed: 10
  width_mm: 190
  height_mm: 255
  atlas:
    - {feature: CEA, label: CEA}
    - {feature: CA242, label: CA242}
    - {feature: CA125, label: CA125}
    - {feature: 血清白蛋白, label: Albumin}
    - {feature: 总蛋白, label: Total protein}
    - {feature: 白球比, label: A/G ratio}
    - {feature: 前白蛋白, label: Prealbumin}
    - {feature: 胆碱酯酶, label: Cholinesterase}
    - {feature: 红细胞, label: RBC}
    - {feature: 红细胞平均体积, label: MCV}
    - {feature: 平均血小板体积, label: MPV}
    - {feature: 中性粒细胞绝对值, label: Neutrophils}
    - {feature: 乳酸脱氢酶, label: LDH}
    - {feature: 尿素, label: Urea}
  trajectories:
    - {feature: CEA, label: CEA, unit: ng/mL, scale: log}
    - {feature: CA242, label: CA242, unit: U/mL, scale: log}
    - {feature: 血清白蛋白, label: Albumin, unit: g/L}
    - {feature: 白球比, label: A/G, unit: ratio}
    - {feature: 胆碱酯酶, label: Cholinesterase, unit: U/L}
    - {feature: 红细胞平均体积, label: MCV, unit: fL}
paths:
  dir: ${inputs.run_dir}/../figure
  run_dir: ${inputs.run_dir}/../logs/06_figure
hydra:
  job:
    chdir: false
  run:
    dir: ${paths.run_dir}
