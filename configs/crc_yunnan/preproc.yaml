# @package _global_
dataset: crc_yunnan
version: v2
outcome: os
landmark_months: 24
min_observation_dates: 2

inputs:
  split_dir: data/derived/crc_yunnan/splits/${version}/random/seed-20260908
  train_dir: ${inputs.split_dir}/train
  test_dirs: ["${inputs.split_dir}/validation", "${inputs.split_dir}/test"]

preprocessing:
  name: ${preprocessing.log_transform}-${preprocessing.scaling}
  log_transform: auto-log1p
  skew_threshold: 1.0
  scaling: robust

paths:
