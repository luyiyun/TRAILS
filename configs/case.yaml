# @package _global_
defaults:
  - _self_
  - /training: case

observations_csv: data/case/observations.csv
patients_csv: data/case/patients.csv
description: "TRAILS case-study dataset"
feature_order: []
outputs:
  dataset: case_dataset.pt
  dataset_summary: case_dataset_summary.json
  predictions: predictions.pt
  patient_clusters: patient_clusters.csv
  cluster_summary: cluster_summary.csv
  cluster_feature_summary: cluster_feature_summary.csv
  summary: case_summary.json
k_selection:
  enabled: true
  candidate_clusters: [2, 3, 4, 5]
  valid_size: 0.2
  result_dir: k_selection
columns:
  patients:
    patient_id: patient_id
    survival_time: survival_time
    event: event
    cluster_label: cluster_label
  observations:
    patient_id: patient_id
    time: time
    feature: feature
    value: value

paths:
  root: outputs/case
  prefix: case
  suffix: ${now:%Y%m%d-%H%M%S-%f}
  dir: ${paths.root}/${paths.prefix}-${paths.suffix}

hydra:
  job:
    chdir: false
  run:
    dir: ${paths.dir}
  sweep:
    dir: outputs/multirun/case/${now:%Y%m%d-%H%M%S-%f}
    subdir: ${hydra.job.num}
