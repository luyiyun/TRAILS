# @package _global_
defaults:
  - _self_

methods:
  - summary_kmeans
  - risk_stratified_kmeans
  - fpca_kmeans
n_clusters: null
fallback_n_clusters: 3
seed: 20260517
kmeans_iters: 50
ridge_alpha: 1.0
risk_feature_weight: 1.0
fpca_components: 3
fpca_grid_size: 16

paths:
  root: outputs/baseline
  prefix: ${trails_run_prefix:baseline,"",${paths.data_root}}
  suffix: ${now:%Y%m%d-%H%M%S-%f}
  dir: ${paths.root}/${paths.prefix}-${paths.suffix}
  data_root: data/simulated
  explicit_split:
    enabled: false
    train_data: data/simulated/train.pt
    test_data: data/simulated/test.pt

hydra:
  job:
    chdir: false
  run:
    dir: ${paths.dir}
  sweep:
    dir: outputs/multirun/baseline/${now:%Y%m%d-%H%M%S-%f}
    subdir: ${hydra.job.num}
